<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ChessLab" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Logo propio de ChessLab: silueta de caballo de ajedrez dibujada a mano,
       con el degradado esmeralda-cian de la web, dentro de una insignia oscura -->
  <defs>
    <linearGradient id="cl-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="8" fill="#1a1d22" stroke="url(#cl-grad)" stroke-width="1.6"/>
  <svg x="4.5" y="3.5" width="23" height="25" viewBox="14 8 64 88">
    <g fill="url(#cl-grad)">
      <!-- Cabeza y cuello (mirando a la izquierda) -->
      <path d="M33 75 C33 66 38 59 46 53 L27 51 C21 50 17 46 19 41 L24 35 C30 29 35 26 41 23 L45 11 L53 20 C64 23 72 34 74 48 C75 58 73 67 71 75 Z"/>
      <!-- Peana -->
      <rect x="27" y="77" width="46" height="7" rx="2"/>
      <rect x="22" y="86" width="56" height="8" rx="3"/>
    </g>
    <!-- Ojo y crin, del color del fondo -->
    <circle cx="40" cy="32" r="3" fill="#1a1d22"/>
    <path d="M55 28 C62 33 66 42 66 52" fill="none" stroke="#1a1d22" stroke-width="2.6" stroke-linecap="round"/>
  </svg>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
